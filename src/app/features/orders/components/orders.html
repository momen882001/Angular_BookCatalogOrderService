<section class="page-container fade-in orders-page">
  <header class="orders-page__header">
    <div>
      <h1 class="page-title">Orders</h1>
    </div>

    <button class="create-order-btn" type="button" (click)="openPlaceOrder()">
      <i class="bi bi-plus-lg"></i>

      <span> Place Order </span>
    </button>
  </header>

  <app-generic-table
    [dataSource]="tableData()"
    [columns]="columns"
    [actions]="actions"
    [isSearchable]="true"
    searchPlaceholder="Search orders…"
    emptyTableMessage="No orders match your search."
    (search)="onSearch($event)"
  />
</section>
