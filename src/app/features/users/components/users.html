<section class="page-container fade-in users-page">
  <header class="users-page__header">
    <div>
      <h1 class="page-title">Users</h1>
    </div>
  </header>

  <app-generic-table
    [dataSource]="tableData()"
    [columns]="columns"
    [actions]="actions"
    [isSearchable]="true"
    searchPlaceholder="Search users…"
    emptyTableMessage="No users match your search."
    (search)="onSearch($event)"
  />
</section>
